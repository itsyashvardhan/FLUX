<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">FLUX fast file sharing</title>
  <desc id="desc">A glowing file flows between two devices over a local network.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#132b46"/>
      <stop offset="1" stop-color="#0a615f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#66e3d4"/>
      <stop offset="1" stop-color="#a8f36d"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#b6f8ee" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="1020" cy="-30" r="210" fill="#65e3d4" opacity=".09"/>
  <circle cx="140" cy="380" r="240" fill="#a8f36d" opacity=".07"/>

  <g transform="translate(86 84)" fill="none" stroke="#d8ffef" stroke-width="7" stroke-linejoin="round">
    <rect x="0" y="0" width="170" height="112" rx="14"/>
    <path d="M-20 136h210l-20-24H0z"/>
    <rect x="34" y="28" width="102" height="62" rx="8" stroke="#66e3d4"/>
  </g>
  <g transform="translate(944 84)" fill="none" stroke="#d8ffef" stroke-width="7" stroke-linejoin="round">
    <rect x="0" y="0" width="170" height="112" rx="14"/>
    <path d="M-20 136h210l-20-24H0z"/>
    <rect x="34" y="28" width="102" height="62" rx="8" stroke="#a8f36d"/>
  </g>

  <g filter="url(#glow)" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round">
    <path d="M280 140C410 62 470 62 600 140S790 218 920 140"/>
    <path d="M280 184C410 262 470 262 600 184S790 106 920 184" opacity=".72"/>
  </g>
  <g transform="translate(546 112)" filter="url(#glow)">
    <path d="M0 0h62l25 25v86H0z" fill="#11253a" stroke="#d8ffef" stroke-width="5" stroke-linejoin="round"/>
    <path d="M62 0v25h25" fill="none" stroke="#66e3d4" stroke-width="5"/>
    <path d="M16 56h52M16 74h52M16 92h35" stroke="#a8f36d" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="600" y="300" text-anchor="middle" fill="#effff8" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="8">FLUX</text>
  <text x="600" y="332" text-anchor="middle" fill="#a8d8cf" font-family="Segoe UI, Arial, sans-serif" font-size="16" letter-spacing="3">SHARE FILES. KEEP CONTROL.</text>
</svg>
